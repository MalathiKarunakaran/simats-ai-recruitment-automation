services:
  postgres:
    image: postgres:16-alpine
    container_name: simats_recruitment_postgres
    restart: unless-stopped
    ports:
      # Host port 5434 (not the default 5432) -- this machine already runs
      # other unrelated Postgres containers bound to 5432/5433.
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: simats_recruitment_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: simats_recruitment_chromadb
    restart: unless-stopped
    ports:
      # Host 8012, not the ChromaDB-default 8000 -- host 8000 is already
      # taken by an unrelated container on this machine, and the SIMATS API
      # itself also runs locally on port 8010 via uvicorn.
      - "8012:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      # The chromadb/chroma image ships neither curl nor wget, so the
      # healthcheck uses bash's /dev/tcp to make a raw HTTP request instead
      # (verified manually: /api/v2/heartbeat returns 200; /api/v1/heartbeat
      # is deprecated and returns 410 on this image version). CMD-SHELL runs
      # /bin/sh (dash on this image) which does NOT support /dev/tcp -- bash
      # must be invoked explicitly.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: .
    container_name: simats_recruitment_backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      # Internal service-name networking, not the host-mapped ports/localhost
      # used by .env for local (non-Docker) dev -- these override whatever
      # DATABASE_URL/MINIO_ENDPOINT/CHROMA_HOST are set to in .env so the
      # container reaches its sibling containers correctly regardless.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_ENDPOINT: minio:9000
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Cross-origin call to the api.malathi.io domain (see Caddy below),
        # not same-origin -- backend's CORS_ALLOWED_ORIGINS already allows
        # https://app.malathi.io for this reason. Baked in at build time:
        # Vite inlines import.meta.env.* into the static bundle, so this
        # can't be changed at container start like a normal runtime env var.
        VITE_API_BASE_URL: https://api.malathi.io/api/v1
    container_name: simats_recruitment_frontend
    restart: unless-stopped
    expose:
      - "80"

  caddy:
    build:
      context: .
      dockerfile: Caddy.Dockerfile
    container_name: simats_recruitment_caddy
    restart: unless-stopped
    ports:
      # HTTPS only -- port 80 is occupied by something else on the VPS
      # outside this compose project, so Caddy doesn't try to bind it (see
      # Caddyfile: the ACME issuer is configured to skip the HTTP-01
      # challenge, which needs port 80, and use TLS-ALPN-01 instead, which
      # only needs 443).
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Note: n8n itself is NOT self-hosted here -- Phase 6's integration is a
  # webhook client (N8N_BASE_URL) pointing at an existing, externally
  # operated n8n pipeline, not a container this compose file manages.

volumes:
  postgres_data:
  minio_data:
  chromadb_data:
  caddy_data:
  caddy_config:
