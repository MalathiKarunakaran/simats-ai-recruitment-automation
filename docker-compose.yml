services:
  postgres:
    image: postgres:16-alpine
    container_name: simats_recruitment_postgres
    restart: unless-stopped
    ports:
      # Host port 5434 (not the default 5432) -- this machine already runs
      # other unrelated Postgres containers bound to 5432/5433.
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:latest
    container_name: simats_recruitment_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # S3-compatible API
      - "9001:9001" # Web console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: simats_recruitment_chromadb
    restart: unless-stopped
    ports:
      # Host 8012, not the ChromaDB-default 8000 -- host 8000 is already
      # taken by an unrelated container on this machine, and the SIMATS API
      # itself also runs locally on port 8010 via uvicorn.
      - "8012:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    healthcheck:
      # The chromadb/chroma image ships neither curl nor wget, so the
      # healthcheck uses bash's /dev/tcp to make a raw HTTP request instead
      # (verified manually: /api/v2/heartbeat returns 200; /api/v1/heartbeat
      # is deprecated and returns 410 on this image version). CMD-SHELL runs
      # /bin/sh (dash on this image) which does NOT support /dev/tcp -- bash
      # must be invoked explicitly.
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Self-hosted models (2026-09-07, RMS step 6): Qwen3 answers every
  # generation call and BGE-M3 computes resume embeddings when the backend's
  # AI_PROVIDER / EMBEDDING_PROVIDER are set to "ollama" (see .env.example).
  # No host port on purpose: only the backend talks to it, by service name.
  # Models are pulled ONCE after the container first starts and live in the
  # volume:  docker exec simats_recruitment_ollama ollama pull qwen3:4b
  #          docker exec simats_recruitment_ollama ollama pull bge-m3
  # A CPU-only host answers slowly (minutes for a resume score on two
  # vCPUs); the backend waits up to OLLAMA_TIMEOUT_SECONDS for it.
  ollama:
    image: ollama/ollama:latest
    container_name: simats_recruitment_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Keep a loaded model resident so the second request does not pay the
      # load time again; both models fit alongside each other.
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build: .
    container_name: simats_recruitment_backend
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      # Internal service-name networking, not the host-mapped ports/localhost
      # used by .env for local (non-Docker) dev -- these override whatever
      # DATABASE_URL/MINIO_ENDPOINT/CHROMA_HOST are set to in .env so the
      # container reaches its sibling containers correctly regardless.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # This compose file IS the production deployment. The value gates one
      # thing: with no email delivery configured, OTP/reset secrets are never
      # printed and those endpoints answer 503 (app/core/config.py).
      ENVIRONMENT: production
      MINIO_ENDPOINT: minio:9000
      CHROMA_HOST: chromadb
      CHROMA_PORT: 8000
      OLLAMA_BASE_URL: http://ollama:11434
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Cross-origin call to the api.malathi.io domain, not same-origin --
        # backend's CORS_ALLOWED_ORIGINS already allows https://app.malathi.io
        # for this reason. Baked in at build time: Vite inlines
        # import.meta.env.* into the static bundle, so this can't be changed
        # at container start like a normal runtime env var.
        VITE_API_BASE_URL: https://api.malathi.io/api/v1
    container_name: simats_recruitment_frontend
    restart: unless-stopped
    ports:
      # A host-level reverse proxy already running on this VPS (outside
      # Docker -- ports 80/443 are both already bound to it, confirmed live)
      # terminates TLS for app.malathi.io and proxies here. See
      # DEPLOYMENT.md section 6 for that proxy's setup; this project doesn't
      # run its own -- a docker-based `caddy` service was tried first and
      # abandoned once the host-level proxy turned out to already exist and
      # already work (git history has that attempt, if ever needed again).
      - "8011:80"

  # Note: n8n itself is NOT self-hosted here -- Phase 6's integration is a
  # webhook client (N8N_BASE_URL) pointing at an existing, externally
  # operated n8n pipeline, not a container this compose file manages.

volumes:
  postgres_data:
  minio_data:
  chromadb_data:
  ollama_data:
