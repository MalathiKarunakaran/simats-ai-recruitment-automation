# Serves the built SPA. try_files falls back to index.html for any
# unmatched path so React Router's client-side routes (e.g. /vacancies/42)
# work on a hard refresh instead of 404ing at nginx. The API itself is
# called cross-origin against VITE_API_BASE_URL (api.malathi.io) baked in
# at build time -- this container never proxies /api itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy (audit M1, 2026-09-04), built from what the
    # app actually loads and nothing more:
    #   script-src 'self'      -- Vite emits one fingerprinted module script;
    #                             index.html has no inline script.
    #   style-src ... 'unsafe-inline' -- Tailwind's stylesheet is a file, but
    #                             Radix's dialog scroll-lock (react-remove-scroll)
    #                             injects a <style> element at runtime; a nonce
    #                             cannot reach it from a static host, so inline
    #                             STYLES (not scripts) are allowed. Google Fonts'
    #                             CSS is fetched from fonts.googleapis.com.
    #   font-src               -- the Inter/JetBrains Mono files themselves.
    #   img-src data: blob:    -- the seal is inlined by Vite; QR codes are
    #                             blob: URLs from apiFetchBlob.
    #   connect-src            -- the API only (the cross-origin host baked in
    #                             at build time, see docker-compose.yml).
    #   frame-ancestors 'none' -- nobody may frame the app (clickjacking).
    #   object-src 'none', base-uri 'self', form-action 'self' -- no plugins,
    #                             no <base> hijack, no form exfiltration.
    # Defined once here and repeated in each location that has its own
    # add_header, because an add_header inside a location REPLACES every
    # inherited one -- without the repeats, index.html (the one document
    # that matters) would be served with no CSP at all.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.malathi.io; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'";
    add_header Content-Security-Policy $csp always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets/ (index-DTnh27bp.js), so a
    # given URL's content can never change -- cache it hard and never
    # revalidate. A new build produces new filenames, which index.html then
    # points at.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
    }

    # index.html is the ONLY unfingerprinted file, and it is what maps the
    # app to the current asset hashes -- so it must be revalidated on every
    # load. Without this it was served with no Cache-Control at all, leaving
    # browsers to cache it heuristically; a tab left open across a deploy
    # kept running the previous bundle indefinitely. That caused a real
    # incident (2026-08-28): the old bundle went on sending the removed
    # `category` field, Pydantic silently dropped it, and department edits
    # returned 200 OK while changing nothing. `no-cache` still allows a
    # conditional request, so the common case stays a cheap 304 on the ETag.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
