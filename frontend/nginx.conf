# Serves the built SPA. try_files falls back to index.html for any
# unmatched path so React Router's client-side routes (e.g. /vacancies/42)
# work on a hard refresh instead of 404ing at nginx. The API itself is
# called cross-origin against VITE_API_BASE_URL (api.malathi.io) baked in
# at build time -- this container never proxies /api itself.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
