# CI for the SIMATS AI Recruitment Automation System.
#
# Until now every check ran manually on one Windows dev machine, which let two
# real failures through in a single day: a dispatched agent reported "done"
# with its work left uncommitted, and a flaky frontend run was nearly reported
# as a regression. CI removes both by making "did this actually pass?" a fact
# rather than a recollection.
#
# Four independent jobs, deliberately not chained -- a frontend type error
# should not hide a backend failure, and vice versa:
#
#   backend     -- pytest against a real Postgres 16 service
#   frontend    -- tsc -b --force, oxlint, vitest
#   migrations  -- alembic upgrade head against an EMPTY database
#   e2e         -- Playwright against the built bundle + a live backend
#
# That third job is not redundant with `backend`. tests/conftest.py builds its
# schema with `Base.metadata.create_all`, so the migration chain is never
# exercised by the test suite at all -- yet production applies it
# automatically on every deploy (scripts/docker-entrypoint.sh). Without this
# job a broken or branched migration would first be discovered by the
# production container failing to start.

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A newer push to the same branch makes an in-flight run obsolete. The backend
# suite takes 12-20 minutes, so cancelling superseded runs matters here.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Both are required by app/core/config.py (no defaults). Everything else --
  # MinIO, ChromaDB, OpenAI, Anthropic -- has a default and is never reached:
  # tests/conftest.py overrides all four as FastAPI dependencies with
  # in-memory fakes, so no external service is contacted.
  JWT_SECRET_KEY: ci-only-not-a-real-secret
  DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/simats_recruitment
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        # Matches production's image (docker-compose.yml) rather than
        # whatever the runner ships, so a version-specific SQL or native-ENUM
        # difference surfaces here instead of on the VPS.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simats_recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Create the test database
        # conftest.py connects to a dedicated database and builds the schema
        # itself, but does not CREATE DATABASE -- same one-time step the
        # README documents for local dev.
        run: psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE simats_recruitment_test"
        env:
          PGPASSWORD: postgres

      - name: Run pytest
        run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/simats_recruitment_test

  frontend:
    name: Frontend (tsc, lint, vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # `npm install`, NOT `npm ci` -- package-lock.json was generated on
        # Windows, and npm ci's strict lockfile check miscomputes the native
        # optional binaries (Rolldown/lightningcss) when installing on Linux
        # (npm/cli#4828). frontend/Dockerfile makes the same choice for the
        # same reason; see DEPLOYMENT.md's "Known limitations".
        run: npm install

      - name: Type-check
        # `tsc -b --force`, NOT `tsc --noEmit`: tsconfig.json is a solution
        # file with `"files": []`, so --noEmit type-checks ZERO files and exits
        # 0 with real errors present. --force avoids a stale .tsbuildinfo
        # hiding errors between runs. See CLAUDE.md's footgun note.
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm run test

  migrations:
    name: Migrations (alembic upgrade head)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simats_recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Fail if the migration chain has branched
        # Two migrations sharing a down_revision gives alembic multiple heads,
        # which `upgrade head` then refuses. Catching it as its own step makes
        # the cause obvious instead of surfacing as an opaque alembic error.
        run: |
          heads=$(alembic heads | grep -c '(head)' || true)
          echo "alembic heads found: $heads"
          alembic heads
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly 1 alembic head, found $heads -- two migrations likely share a down_revision."
            exit 1
          fi

      - name: Apply every migration to an empty database
        run: alembic upgrade head

      - name: Verify the applied schema matches the models
        # The real payload of this job: production builds its schema from
        # migrations, while the test suite builds it from
        # Base.metadata.create_all -- so a model column added without a
        # migration passes every test and then fails at runtime in production.
        # Run as a module so `app` is importable from the repo root. See the
        # script's docstring for the one alembic false positive it filters
        # (and why filtering it does not make the check vacuous).
        run: python -m scripts.check_schema_drift

  e2e:
    name: E2E (Playwright against a built frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The suite in e2e/ drives the REAL built bundle in a real browser -- the
    # only check in this repo that has ever caught what jsdom cannot (a
    # dropdown running off the bottom of the window, a KPI tile disagreeing
    # with its API, a CSP violation). Until now it ran only when someone
    # remembered to run it, and only against production, i.e. after a
    # deploy. Here it runs on the commit itself: migrations + seed +
    # e2e fixture seed into an empty Postgres, uvicorn on :8000, the Vite
    # production build served by `vite preview` on :4173, a token pair
    # minted by scripts/e2e_mint_tokens.py, then Playwright.
    #
    # Same 66 tests as a production run; the one production-only test (the
    # CSP header on the served document) skips here, because vite preview
    # sets no headers and the policy is injected by the spec instead.

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simats_recruitment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The refresh cookie is SameSite=Strict on the API host; the bundle at
      # localhost:4173 calling localhost:8000 is same-site, and /auth/refresh
      # checks Origin against this list.
      CORS_ALLOWED_ORIGINS: http://localhost:4173
      ENVIRONMENT: development
      # Not a secret: an ephemeral database that exists for one job. Set only
      # so the seeder does not print an auto-generated password to the log.
      SEED_SUPER_ADMIN_PASSWORD: ci-only-superadmin-password
      E2E_BASE_URL: http://localhost:4173

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            package-lock.json

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend and Playwright dependencies
        # `npm install`, not `npm ci` -- see the frontend job.
        run: |
          (cd frontend && npm install)
          npm install
          npx playwright install --with-deps chromium

      - name: Migrate and seed the database
        # The same chain production applies, then the app's own seed and the
        # e2e fixture seed (locations, designations, >10 departments on one
        # campus -- everything the specs discover; see scripts/e2e_seed.py).
        run: |
          alembic upgrade head
          python -m app.db.seed
          python -m scripts.e2e_seed

      - name: Start the backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/v1/auth/login-options > /dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::backend did not come up on :8000"; cat backend.log; exit 1

      - name: Build and serve the frontend
        # The API base URL is baked into the bundle at build time
        # (frontend/.env.example). `vite preview` serves dist/ as a static
        # site, which is what nginx does in production.
        working-directory: frontend
        run: |
          VITE_API_BASE_URL=http://localhost:8000/api/v1 npm run build
          nohup npx vite preview --port 4173 --strictPort > ../preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4173/login > /dev/null; then
              echo "preview up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview did not come up on :4173"; cat ../preview.log; exit 1

      - name: Run Playwright
        # The minted pair is for a user in this job's throwaway database and
        # dies with it; it is passed inline rather than exported so it never
        # lands in the job log.
        run: E2E_TOKENS="$(python scripts/e2e_mint_tokens.py)" npx playwright test

      - name: Upload the Playwright report and server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            backend.log
            preview.log
          retention-days: 7
